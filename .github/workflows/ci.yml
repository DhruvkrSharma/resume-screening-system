name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Minimal GITHUB_TOKEN permissions required for read-only CI jobs
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Backend – run pytest against the FastAPI executor
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt httpx pytest

      - name: Run pytest
        working-directory: backend
        run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Frontend – verify the Vite build succeeds
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
